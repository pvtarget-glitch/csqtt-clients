# Настройки демона csqttd. Все значения ниже — значения по умолчанию;
# раскомментируй строку, чтобы изменить. После правки:
#   sudo systemctl restart csqttd

# Имя TUN-интерфейса и MTU (1500 — как в Android-клиенте csqtt).
#interface = "csqtt0"
#mtu = 1500

# Таблица маршрутизации туннеля и приоритет первого из трёх правил ip rule
# (занимаются приоритеты N, N+1, N+2). Меняй, если пересекаются с другим VPN.
#table = 51880
#rule_priority = 9980

# DNS на время работы туннеля:
#   "auto"       — systemd-resolved, если он обслуживает /etc/resolv.conf,
#                  иначе временная подмена /etc/resolv.conf;
#   "resolved"   — только systemd-resolved;
#   "resolvconf" — только /etc/resolv.conf;
#   "none"       — не трогать DNS системы.
#dns = "auto"

# Туннель csqtt передаёт только IPv4.
#   "block" — пока туннель поднят, IPv6 наружу недоступен (без утечек);
#   "leak"  — IPv6 идёт мимо туннеля, как на Android.
#ipv6 = "block"

# Ядро csqtt и пользователь, от имени которого оно работает. Трафик этого
# пользователя идёт мимо туннеля — не запускай от него ничего другого.
#core_path = "/usr/lib/csqtt/csqtt-core"
#core_user = "csqtt-core"

# Группа, участники которой управляют туннелем командой csqtt.
#control_group = "csqtt"

# Сколько строк журнала ядра хранить для `csqtt logs`.
#log_lines = 2000

# Программы мимо туннеля (`csqtt direct -- …`, вкладка «Программы»):
# cgroup v2 для них, путь от корня cgroup. Нужен пакет nftables.
#cgroup_root = "/sys/fs/cgroup"
#bypass_cgroup = "csqtt-direct"
