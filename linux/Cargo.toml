[workspace]
resolver = "2"
members = ["crates/common", "crates/csqttd", "crates/csqtt", "gui/src-tauri"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
flate2 = "1"
libc = "0.2"
nix = { version = "0.29", features = ["socket", "uio", "user", "fs", "signal", "net"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "signal"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
