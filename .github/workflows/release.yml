name: Build & Release

# Сборка .deb Linux-клиента из папки linux/ и, по желанию, релиз.
# Описание релиза берётся из .github/release-notes/<версия>.md.
# Запуск: Actions → Build & Release (Linux) → Run workflow.

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Create Github Release?'
        type: boolean
        required: true
        default: false
      prerelease:
        description: "Пометить как тестовый выпуск (pre-release)"
        type: boolean
        required: false
        default: false
      version:
        description: "Release version tag (e.g. v0.2.0)"
        required: false
        default: "v0.8.0"

permissions:
  contents: write

jobs:
  server:
    # Сервер csqtt для установки на VPS из окна и `csqtt server install`:
    # статические бинарники musl под x86_64, aarch64 и armv7.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-server -> ../linux/target/server"
      - name: Тесты сервера и сборка под VPS
        run: |
          pip install --user --break-system-packages cargo-zigbuild
          export PATH="$HOME/.local/bin:$PATH"
          scripts/build-server.sh --tests
          scripts/build-server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: linux/dist/server/

  deb:
    needs: server
    # Сборка на 22.04 (glibc 2.35): пакет ставится на Ubuntu 22.04+,
    # Mint 21+ и Debian 12+ — glibc совместима вперёд. Из тех же бинарников
    # собираются .rpm (Fedora, openSUSE) и пакет Arch.
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/gui/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            linux -> target
            rust-client -> ../linux/target/core
      - name: Зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config librsvg2-bin \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Модульные тесты
        run: cargo test -p csqtt-common -p csqttd -p csqtt
      - name: Интеграционные тесты (сеть в отдельном namespace, имитатор ядра)
        run: |
          sudo apt-get install -y iproute2 nftables python3-cryptography
          cargo build -p csqttd -p csqtt
          sudo tests/integration.sh
          python3 tests/link_compat.py target/debug/csqtt
      - name: Тесты ядра
        if: matrix.arch == 'amd64'
        working-directory: rust-client
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/linux/target/core
        # Часть сетевых тестов ядра чувствительна к нагрузке на двухъядерном
        # раннере (таймауты 3 с при параллельном прогоне) — один повтор.
        run: |
          cargo test --release --locked --ignore-rust-version || {
            echo "::warning::тесты ядра упали, повтор"
            cargo test --release --locked --ignore-rust-version
          }
      - name: Проверка контракта с настоящим ядром
        run: |
          scripts/build-core.sh
          CSQTT_CORE_BIN="$PWD/dist/csqtt-core" cargo test -p csqttd -- --ignored
      - name: Установка сервера по SSH (настоящий sshd, имитатор deploy.sh)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get install -y openssh-server openssh-client
          sudo tests/deploy-test.sh
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: linux/dist/server
      - name: Сборка .deb (ядро из rust-client в корне форка)
        run: |
          chmod 755 dist/server/csqtt-linux-*
          scripts/build-deb.sh --no-core
      - name: Пакеты .rpm и Arch из тех же бинарников
        run: |
          sudo apt-get install -y rpm libarchive-tools zstd
          scripts/build-rpm-arch.sh dist/csqtt-linux_*_${{ matrix.arch }}.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            linux/dist/*.deb
            linux/dist/*.rpm
            linux/dist/*.pkg.tar.zst

  linux-check:
    # Пакеты ставятся в настоящих дистрибутивах: зависимости находятся,
    # библиотеки окна разрешаются, пользователь ядра создаётся.
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:latest
            install: dnf install -y /pkg/csqtt-*.x86_64.rpm
          - name: opensuse
            image: opensuse/tumbleweed:latest
            install: zypper --non-interactive install --allow-unsigned-rpm /pkg/csqtt-*.x86_64.rpm
          - name: arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm /pkg/csqtt-*-x86_64.pkg.tar.zst
          - name: debian
            image: debian:12
            install: apt-get update && apt-get install -y /pkg/csqtt-linux_*_amd64.deb
    name: linux-check (${{ matrix.name }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: pkg
      - name: Установка и проверка в ${{ matrix.name }}
        run: |
          docker run --rm -v "$PWD/pkg:/pkg:ro" "${{ matrix.image }}" sh -c '
            set -e
            ${{ matrix.install }}
            csqtt --version
            csqttd --version
            command -v csqtt-gui
            missing="$(ldd "$(command -v csqtt-gui)" "$(command -v csqttd)" /usr/lib/csqtt/csqtt-core | grep "not found" || true)"
            [ -z "$missing" ] || { echo "нет библиотек: $missing"; exit 1; }
            getent passwd csqtt-core
            getent group csqtt
            grep -q "ExecStart=$(command -v csqttd)" /usr/lib/systemd/system/csqttd.service
            echo "пакет ставится и запускается"
          '

  router:
    # Роутер Keenetic с Entware (aarch64): служба, CLI и ядро, musl.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            linux -> target
            rust-client -> ../linux/target/core-router
      - name: Тест режима «только интерфейс»
        run: |
          sudo apt-get update && sudo apt-get install -y iproute2
          cargo build -p csqttd -p csqtt
          sudo tests/interface-mode.sh
      - name: Сборка под aarch64
        run: |
          pip install --user --break-system-packages cargo-zigbuild
          export PATH="$HOME/.local/bin:$PATH"
          scripts/build-router.sh
      - uses: actions/upload-artifact@v4
        with:
          name: router-aarch64
          path: linux/dist/csqtt-router-*.tar.gz

  openwrt:
    # OpenWrt 24.10 и 25.x: статические бинарники musl и установочный скрипт.
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf, x86_64-unknown-linux-musl]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            linux -> target
            rust-client -> ../linux/target/core-router
      - name: Сборка
        env:
          CSQTT_OPENWRT_TARGET: ${{ matrix.target }}
        run: |
          pip install --user --break-system-packages cargo-zigbuild
          export PATH="$HOME/.local/bin:$PATH"
          scripts/build-openwrt.sh
      - name: Проверка архива
        run: |
          archive="$(ls dist/csqtt-openwrt-*.tar.gz)"
          mkdir -p check && tar -C check -xzf "$archive"
          dir="$(ls -d check/*/)"
          for file in csqttd.init install.sh uninstall.sh csqttd.toml ARCH README.md bin/csqttd bin/csqtt bin/csqtt-core; do
            [ -e "$dir/$file" ] || { echo "нет $file"; exit 1; }
          done
          sh -n "$dir/install.sh" && sh -n "$dir/uninstall.sh" && sh -n "$dir/csqttd.init"
          for binary in "$dir"/bin/*; do
            file -b "$binary" | grep -Eq 'statically linked|static-pie linked' || { echo "$binary не статический"; file "$binary"; exit 1; }
          done
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then
            "$dir/bin/csqtt" --version
            "$dir/bin/csqttd" --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.target }}
          path: linux/dist/csqtt-openwrt-*.tar.gz

  macos:
    # Установщики .pkg для Apple Silicon и Intel (сборка на Apple Silicon).
    needs: server
    runs-on: macos-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            linux -> target
            rust-client -> ../linux/target/core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/gui/package-lock.json
      - name: Служба с имитатором ядра
        run: |
          cargo build --locked -p csqttd -p csqtt
          sudo tests/macos-test.sh
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: linux/dist/server
      - name: Установщик для Apple Silicon
        run: |
          chmod 755 dist/server/csqtt-linux-*
          scripts/build-macos-pkg.sh
      - name: Установщик для Intel
        run: CSQTT_MAC_TARGET=x86_64-apple-darwin scripts/build-macos-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: linux/dist/*.pkg

  windows:
    # Установщик для Windows x64 (NSIS, служба csqttd, Wintun).
    needs: server
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            linux -> target
            rust-client -> ../linux/target/core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/gui/package-lock.json
      - name: Модульные тесты
        run: cargo test --locked -p csqtt-common -p csqttd -p csqtt
      - name: Wintun
        run: |
          curl -sSfL -o /tmp/wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          unzip -o -q /tmp/wintun.zip -d /tmp/wintun
          mkdir -p dist target/debug
          cp /tmp/wintun/wintun/bin/amd64/wintun.dll dist/
          cp /tmp/wintun/wintun/bin/amd64/wintun.dll target/debug/
      - name: Служба с имитатором ядра
        run: |
          cargo build --locked -p csqttd -p csqtt
          tests/windows-test.sh
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: linux/dist/server
      - name: Установщик
        run: scripts/build-windows.sh
      - name: Установка, окно, удаление
        run: |
          SETUP="$(ls dist/csqtt-windows-*-setup.exe | head -1)"
          "$SETUP" //S
          sleep 5
          sc.exe query csqttd | grep -q RUNNING
          "/c/Program Files/csqtt/csqtt.exe" status
          tests/windows-gui-smoke.sh
          "/c/Program Files/csqtt/uninstall.exe" //S
          for _ in $(seq 1 30); do [ -e "/c/Program Files/csqtt/csqttd.exe" ] || break; sleep 1; done
          if sc.exe query csqttd > /dev/null 2>&1; then echo "служба осталась"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: linux/dist/csqtt-windows-*-setup.exe

  release:
    if: ${{ github.event.inputs.make_release == 'true' }}
    needs: [deb, linux-check, router, openwrt, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
      - name: Описание релиза
        run: |
          f=".github/release-notes/${{ github.event.inputs.version }}.md"
          if [ -f "$f" ]; then
            cp "$f" release-notes.md
          else
            echo "::warning::Нет файла $f — релиз выйдет без описания изменений"
            printf 'Описание изменений для этой версии не добавлено.\n' > release-notes.md
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: router-aarch64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: openwrt-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-pkg
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: dist
      - name: Контрольные суммы (по ним окно и csqtt update проверяют обновления)
        run: |
          cd dist
          sha256sum *.deb *.rpm *.pkg.tar.zst *.tar.gz *.pkg *-setup.exe > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          name: "csqtt-clients ${{ github.event.inputs.version }}"
          body_path: release-notes.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/csqtt-router-*.tar.gz
            dist/csqtt-openwrt-*.tar.gz
            dist/*.pkg
            dist/*-setup.exe
            dist/SHA256SUMS
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
