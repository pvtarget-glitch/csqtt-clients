name: Build & Release (Linux)

# Сборка .deb Linux-клиента из папки linux/ и, по желанию, релиз.
# Описание релиза берётся из .github/release-notes/<версия>.md.
# Запуск: Actions → Build & Release (Linux) → Run workflow.

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Create Github Release?'
        type: boolean
        required: true
        default: false
      version:
        description: "Release version tag (e.g. v0.2.0)"
        required: false
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/gui/package-lock.json
      - name: Зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config librsvg2-bin \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Модульные тесты
        run: cargo test -p csqtt-common -p csqttd -p csqtt
      - name: Сборка .deb (ядро из корня форка без изменений)
        run: scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: linux/dist/*.deb

  release:
    if: ${{ github.event.inputs.make_release == 'true' }}
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
      - name: Описание релиза
        run: |
          f=".github/release-notes/${{ github.event.inputs.version }}.md"
          if [ -f "$f" ]; then
            cp "$f" release-notes.md
          else
            echo "::warning::Нет файла $f — релиз выйдет без описания изменений"
            printf 'Описание изменений для этой версии не добавлено.\n' > release-notes.md
          fi
      - uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          name: "csqtt-linux ${{ github.event.inputs.version }}"
          body_path: release-notes.md
          files: dist/*.deb
          draft: false
          prerelease: false
